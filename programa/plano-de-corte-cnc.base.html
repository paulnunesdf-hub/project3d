<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano de Corte CNC</title>
<style>
/* Layout: janela no estilo Cut Pro — faixa de botões no topo, árvore à esquerda, área de trabalho com abas, barra de status */
:root{
  --chrome:#dfe8f2; --ribbon:#f4f7fb; --ribbon-line:#c3cfdc; --panel:#ffffff; --bg:#eef2f6; --ink:#1d2733; --muted:#5d6b7a;
  --line:#cfd8e2; --line2:#e4e9ef; --blue:#2f6db5; --blue-soft:#cfe2f6; --blue-hover:#e3eefa; --title:#5f86b3;
  --green:#2e9d4b; --red:#c8372d; --amber:#b7791f; --sheet:#f1ece2; --sheet-edge:#9a8a6a; --band:#d0461b; --cut:#0e7c7b; --rapid:#d0461b;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --mono:Consolas,"Cascadia Mono","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.35 var(--sans);overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:2px;padding:3px 5px}
input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
input[type=checkbox],input[type=radio]{accent-color:var(--blue);width:14px;height:14px;margin:0}
textarea{font-family:var(--mono);font-size:12px;width:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100%}
/* abas Arquivo / Principal */
.rtabs{display:flex;align-items:end;gap:2px;background:var(--chrome);padding:4px 6px 0;border-bottom:1px solid var(--ribbon-line)}
.rtabs button{border:1px solid transparent;border-bottom:0;background:none;padding:3px 12px;cursor:pointer}
.rtabs .arq{background:var(--blue);color:#fff;border-color:var(--blue)}
.rtabs .on{background:var(--ribbon);border-color:var(--ribbon-line);position:relative;top:1px}
.rtabs .apptitle{margin-left:auto;color:var(--title);padding:3px 8px;font-size:12px}
/* faixa de botões */
.ribbon{display:flex;background:var(--ribbon);border-bottom:1px solid var(--ribbon-line);overflow-x:auto;min-height:92px}
.rgroup{display:flex;flex-direction:column;border-right:1px solid var(--ribbon-line);padding:4px 4px 2px}
.rgroup .btns{display:flex;gap:1px;flex:1}
.rgroup .cap{text-align:center;color:var(--muted);font-size:11px;padding-top:2px}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;min-width:58px;white-space:nowrap;padding:3px 2px;border:1px solid transparent;border-radius:2px;background:none;cursor:pointer;font-size:11.5px;line-height:1.1;text-align:center}
.rbtn svg{width:32px;height:32px;flex:none}
.rbtn:hover:not(:disabled){background:var(--blue-hover);border-color:#a9c6e6}
.rbtn.on{background:var(--blue-soft);border-color:#86b0dc}
.rbtn:disabled{opacity:.4;cursor:default}
/* corpo */
.body{display:grid;grid-template-columns:230px 1fr;min-height:0}
.tree{background:var(--panel);border-right:1px solid var(--ribbon-line);overflow:auto;padding:6px 0;user-select:none}
.tree h4{margin:2px 8px 6px;color:var(--title);font-size:13px}
.tree ul{list-style:none;margin:0;padding-left:16px}
.tree>ul{padding-left:6px}
.tree li>div{display:flex;align-items:center;gap:5px;padding:2px 4px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.tree li>div:hover{background:var(--blue-hover)}
.tree li>div.on{background:var(--blue-soft);border-color:#86b0dc}
.tree .tw{width:12px;color:var(--muted);font-size:10px;text-align:center}
.tree svg{width:16px;height:16px;flex:none}
.tree .red{color:var(--red);font-weight:600}
.work{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.dtabs{display:flex;gap:2px;padding:4px 6px 0;background:var(--bg);overflow-x:auto;border-bottom:1px solid var(--line)}
.dtabs button{border:1px solid var(--line);border-bottom:0;background:#e9eef4;padding:4px 10px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.dtabs button.on{background:#fff;position:relative;top:1px}
.dtabs .x{color:var(--muted);font-size:11px;padding:0 2px}
.dtabs .x:hover{color:var(--red)}
.content{overflow:auto;background:#fff;min-height:0;position:relative}
.pad{padding:10px 12px}
.status{display:flex;gap:18px;align-items:center;background:var(--chrome);border-top:1px solid var(--ribbon-line);padding:3px 10px;font-size:12px;color:var(--ink);min-height:24px}
.status .sp{flex:1}
.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#ffe58a}100%{background:transparent}}
.rowdel{visibility:hidden;border:0;background:none;color:#c8372d;cursor:pointer;font-size:13px;padding:0 2px}
#gridBody tr:hover .rowdel,#gridBody tr.sel .rowdel{visibility:visible}
.btn.danger{background:linear-gradient(#e2584c,#c8372d);color:#fff;border-color:#a52b22}
.linkbtn{background:none;border:0;padding:0;color:#9a5b00;cursor:pointer;font:inherit;text-decoration:underline}
.savewarn{background:#fde2dc;border-top:2px solid #c8372d;color:#7a1d12;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stale{background:#fff4d6;border:1px solid #e0b84a;padding:8px 10px;margin:6px 8px;display:flex;gap:10px;align-items:center}
/* painel informações */
.info{border:1px solid var(--line);margin:8px;border-radius:2px}
.info>header{display:flex;align-items:center;gap:6px;padding:5px 8px;font-weight:600;cursor:pointer;color:#2c4a6b}
.info .grid{display:grid;grid-template-columns:auto minmax(160px,2fr) auto minmax(110px,1fr) auto minmax(160px,1.4fr) auto 90px;gap:6px 8px;align-items:center;padding:4px 10px 10px}
.info label{color:var(--muted);text-align:right;white-space:nowrap}
.info .obs{grid-column:2/-1}
.gridbar{display:flex;align-items:center;gap:2px;margin:0 8px 4px}
.ibtn{width:24px;height:22px;border:1px solid var(--line);background:#f6f8fa;border-radius:2px;cursor:pointer;display:grid;place-items:center;padding:0}
.ibtn:hover{background:var(--blue-hover)}
.ibtn svg{width:16px;height:16px}
.search{margin-left:auto;display:flex;align-items:center;border:1px solid var(--line);background:#fff}
.search input{border:0;width:200px}
table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl{width:100%}
table.furos{border-collapse:collapse;font-size:11px;margin-top:4px;width:100%} table.furos th,table.furos td{border:1px solid #ddd;padding:1px 4px;text-align:left} table.furos .n{text-align:right}
.tbl th{background:linear-gradient(#fbfcfd,#eef2f6);border:1px solid var(--line);font-weight:400;color:#2c3e50;text-align:left;padding:3px 5px;white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl td{border:1px solid var(--line2);padding:1px 4px;height:22px;white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr.sel>td{background:#dcebfa}
.tbl tr:hover>td{background:#f2f7fc}
.tbl tr.sel:hover>td{background:#d2e5f8}
.gridwrap{margin:0 8px 8px;border:1px solid var(--line);overflow:auto;max-height:calc(100% - 10px)}
.items input:not([type=checkbox]){border:1px solid transparent;background:transparent;width:100%;padding:1px 3px}
.items input:not([type=checkbox]):hover,.items input:not([type=checkbox]):focus{border-color:var(--line);background:#fff}
.items input[type=number]{width:72px}
.items td.sel{width:16px;color:var(--blue);text-align:center;font-size:11px;background:#f6f8fa}
.items .nm{display:flex;align-items:center;gap:4px;min-width:280px}
.items .nm .tw{width:14px;border:0;background:none;cursor:pointer;color:var(--muted);padding:0}
.items .nm svg{width:18px;height:18px;flex:none}
.items .child .nm{padding-left:22px}
.items .acc td{color:#444}
.ops{display:flex;align-items:center;gap:4px;cursor:pointer}
.ops svg{width:26px;height:18px}
.ops span{font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
/* plano de corte */
.mtabs{display:flex;gap:2px;padding:4px 6px 0;border-bottom:1px solid var(--line);overflow-x:auto;background:#f6f8fa}
.mtabs button{border:1px solid var(--line);border-bottom:0;background:#eef2f6;padding:4px 10px;cursor:pointer;white-space:nowrap}
.mtabs button.on{background:#fff;position:relative;top:1px;color:var(--blue)}
.pbody{display:grid;grid-template-columns:170px 1fr;height:calc(100% - 31px)}
.slist{border-right:1px solid var(--line);overflow:auto;background:#fafbfc}
.slist button{display:flex;gap:8px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line2);background:none;padding:6px;cursor:pointer;text-align:left}
.slist button.on{background:var(--blue-soft)}
.slist svg{width:56px;height:38px;flex:none;border:1px solid var(--line)}
.slist small{display:block;color:var(--muted)}
.pmain{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.subbar{display:flex;gap:6px;padding:6px 8px;align-items:center;border-bottom:1px solid var(--line2)}
.sbtn{border:1px solid var(--line);background:#f4f7fb;padding:4px 10px;cursor:pointer;border-radius:2px}
.sbtn.on{background:var(--blue-soft);border-color:#86b0dc;color:#174a80}
.btn{border:1px solid #9fb3c8;background:linear-gradient(#fff,#e9eef4);padding:4px 12px;cursor:pointer;border-radius:2px}
.btn svg{width:18px;height:18px;vertical-align:middle;margin-right:4px}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:linear-gradient(#4d8ad0,#2f6db5);color:#fff;border-color:#285e9d}
.btn:disabled{opacity:.5;cursor:default}
.pview{display:grid;grid-template-columns:120px 1fr;min-height:0;height:100%}
.legend{padding:8px 4px 8px 8px;overflow:auto;font-size:11.5px}
.legend div{display:flex;align-items:center;gap:5px;margin-bottom:3px;white-space:nowrap}
.legend i{display:inline-grid;place-items:center;width:16px;height:14px;font-style:normal;font-size:10px;border:1px solid #8893a0}
.canvas{overflow:auto;padding:10px;background:#e9edf1}
.canvas svg{display:block;background:#fff;box-shadow:0 0 0 1px #b8c2cc}
.canvas.move .pc{cursor:move}
/* backstage */
.back{position:absolute;inset:0;display:grid;grid-template-columns:150px 1fr;background:#fff;z-index:20}
.back nav{background:linear-gradient(90deg,#f7f9fc,#eaf0f7);border-right:1px solid var(--ribbon-line);padding:8px 0;display:flex;flex-direction:column}
.back nav button{border:0;background:none;text-align:left;padding:7px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.back nav button:hover{background:var(--blue-hover)}
.back nav button.on{background:var(--blue);color:#fff}
.back nav hr{border:0;border-top:1px dotted #9aa8b6;margin:6px 10px;width:auto}
.back section{overflow:auto;padding:14px 18px}
.back h2{font-size:15px;margin:0 0 10px;color:#2c4a6b}
.prow{display:grid;grid-template-columns:4px 1fr 90px 90px 220px 30px;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line2);cursor:pointer}
.prow:hover{background:var(--blue-hover)}
.prow .bar{background:#2c4a6b;height:32px}
.prow b{display:block}
.prow i{color:var(--muted);font-size:12px}
.btabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:10px 0 6px}
.btabs button{border:1px solid var(--line);border-bottom:0;background:#f4f7fb;padding:4px 14px;cursor:pointer}
.btabs button.on{background:#fff;position:relative;top:1px}
.plug{display:grid;grid-template-columns:4px 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line2)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#d0461b;color:#fff;font-size:11px;text-align:center;font-weight:600}
.plug .bar{background:#2c4a6b;height:34px}
.plug small{display:block;color:var(--muted)}
.replist button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px;cursor:pointer;text-align:left}
.replist button.on{background:var(--blue-soft)}
.replist svg{width:26px;height:26px}
.ptool{display:flex;gap:4px;align-items:center;padding:4px 6px;border:1px solid var(--line);border-bottom:0;background:var(--ribbon,#eef2f7)}
.ptool .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.prev{border:1px solid var(--line);background:#8c96a1;overflow:auto;height:calc(100vh - 262px);padding:12px}
.prev .page{background:#fff;margin:0 auto 12px;padding:10mm;box-shadow:0 1px 4px rgba(0,0,0,.4);width:210mm;transform-origin:top center}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;max-width:900px}
.fgrid label{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:12px}
/* modal */
.mback{position:fixed;inset:0;background:rgba(30,40,55,.35);display:grid;place-items:center;z-index:50}
.modal{background:#fff;border:1px solid #7f95ad;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:calc(100vw - 30px);max-height:calc(100vh - 30px);display:flex;flex-direction:column}
.modal>header{display:flex;align-items:center;padding:5px 8px;background:linear-gradient(#fdfdfe,#e8eef5);border-bottom:1px solid var(--line)}
.modal>header b{font-weight:400}
.modal>header .x{margin-left:auto;background:#c94a3e;color:#fff;border:0;width:22px;height:18px;cursor:pointer}
.modal .mb{padding:12px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:8px 12px;border-top:1px solid var(--line2);align-items:center}
.box{border:1px solid var(--line);padding:8px 10px;margin-bottom:10px}
/* editor de operações */
.ed{display:grid;grid-template-columns:360px 1fr;gap:10px;width:min(1180px,calc(100vw - 40px));height:min(700px,calc(100vh - 110px))}
.ed .left{overflow:auto;display:flex;flex-direction:column;gap:8px}
.ed .kv{display:grid;grid-template-columns:90px 1fr;gap:4px 8px}
.ed .kv span{color:var(--muted)}
.side{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:5px 6px;margin-bottom:5px}
.side select{flex:1;min-width:0}
.ed .right{display:grid;grid-template-rows:auto 1fr auto;border:1px solid var(--line);min-height:0}
.ed .tools{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--line2);flex-wrap:wrap;align-items:center}
.ed .tools .ibtn.on{background:var(--blue-soft);border-color:#86b0dc}
.ed .draw{min-height:0;overflow:hidden;display:grid;place-items:center;background:#fbfcfd}
.ed .draw svg{width:100%;height:100%}
.optable td{padding:1px 2px}
.simwrap{display:flex;flex-direction:column;gap:6px;padding:8px;min-height:0}
.simbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.simbody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;min-height:0}
.simcv{position:relative;min-width:0}.simcv canvas{display:block;max-width:100%}#simTop{position:absolute;left:0;top:0}
.simside{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);padding:8px;background:#fff}
.simleg{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin-top:6px}.simleg i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-2px;border:1px solid #999}
@media (max-width:900px){.simbody{grid-template-columns:1fr}}
.ed.big{width:calc(100vw - 30px);height:calc(100vh - 100px)}
.ed .right{grid-template-rows:auto auto 1fr auto}
.ed .params{display:flex;gap:8px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line2);min-height:32px;flex-wrap:wrap}
.ed .tools .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.ed .esqrow{display:flex;gap:4px;align-items:center}.ed .esqrow select{flex:1;min-width:0}
.ed .chk{display:flex;gap:6px;align-items:center}
.ed .info{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid #2f6db5;border-radius:50%;color:#2f6db5;font-size:10px;font-style:italic;cursor:help;margin-left:auto;flex:none}
.ed .oplist{border:1px solid var(--line);flex:1;min-height:120px;overflow:auto}
.ed .oplist>header{display:flex;align-items:center;justify-content:center;padding:4px;border-bottom:1px solid var(--line2);position:relative}
.ed .oplist>header .ibtn{position:absolute;right:4px}
.ed details.opg{border-bottom:1px solid var(--line2);padding:2px 6px}
.ed details.opg summary{cursor:pointer;font-weight:600;padding:3px 0}
.optable tr.on{background:#dcebfa}.optable tr[data-op]{cursor:pointer}.optable select{width:78px}
.ed .edfoot{display:flex;gap:16px;padding:6px 10px;align-items:center;border-top:1px solid var(--line2)}
.ops .oi{width:18px;height:18px}
.vbtn,.obtn{background:none;border:0;cursor:pointer;padding:0;width:100%;min-height:18px;display:grid;place-items:center}
.vbtn svg,.obtn svg{width:16px;height:16px}
.optable input{width:54px}
.toast{position:fixed;right:16px;bottom:34px;background:#1d2733;color:#fff;padding:8px 14px;border-radius:3px;z-index:80;max-width:420px}
.code{font:12px/1.4 var(--mono);background:#f6f8fa;border:1px solid var(--line);padding:8px;max-height:260px;overflow:auto;white-space:pre;margin:0}
.progress{height:8px;background:#e6ebf0;border-radius:4px;overflow:hidden}
.progress div{height:100%;background:var(--blue);width:0}
/* impressão */
#printArea{display:none}
.r-page h1{font-size:16px;margin:0 0 2px}
.r-page h3{font-size:13px;margin:12px 0 4px}
.r-page table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px}
.r-page th,.r-page td{border:1px solid #999;padding:2px 4px;text-align:left}
.r-page td.n,.r-page th.n{text-align:right}
.r-page .sheetbox{break-inside:avoid;margin-bottom:6mm}
.r-page .sheetbox svg{width:100%;height:auto;max-height:150mm}
.r-page .meta{color:#444;font-size:11px;margin-bottom:6px}
.labels{display:flex;flex-wrap:wrap;gap:6px}
.label{width:100mm;height:50mm;background:#fff;color:#111;border:1px solid #999;padding:2.5mm 3mm;display:grid;grid-template-columns:1fr 22mm;grid-template-rows:auto 1fr auto;gap:1mm 3mm;overflow:hidden;break-inside:avoid;font-family:var(--sans)}
.label .t{grid-column:1/3;display:flex;justify-content:space-between;font:600 9pt var(--mono)}
.label .d{font-weight:700;font-size:10.5pt;line-height:1.15;overflow:hidden}
.label .m{font:600 13pt var(--mono);margin-top:1mm}
.label .x{font-size:7.5pt;color:#333;margin-top:1mm}
.label .b{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7pt}
.label .bar{grid-column:1/3;display:flex;align-items:flex-end;gap:3mm}
.label .bar svg{height:9mm;flex:1}
.label .bar span{font:8pt var(--mono)}
@media print{
  body{overflow:visible;height:auto}
  #app,.mback,.toast{display:none!important}
  #printArea{display:block!important}
  .r-page{page-break-after:always}
  .r-page:last-child{page-break-after:auto}
  .p-label .label{border:0;page-break-after:always}
  .p-label .labels{gap:0}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gCab" x1="0" x2="1"><stop offset="0" stop-color="#c9a77a"/><stop offset="1" stop-color="#a8865a"/></linearGradient>
    <symbol id="i-print" viewBox="0 0 32 32"><rect x="8" y="3" width="16" height="9" fill="#fff" stroke="#556"/><rect x="3" y="11" width="26" height="12" rx="2" fill="#4a5a6c"/><rect x="8" y="19" width="16" height="10" fill="#fff" stroke="#556"/><path d="M10 23h12M10 26h9" stroke="#889"/><circle cx="25" cy="15" r="1.4" fill="#7fe07f"/></symbol>
    <symbol id="i-cube" viewBox="0 0 32 32"><path d="M4 9l11-5 11 5v13l-11 6-11-6z" fill="#6b7f95"/><path d="M4 9l11 5 11-5" fill="none" stroke="#a9b8c8"/><path d="M15 14v14" stroke="#a9b8c8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 32 32"><circle cx="24" cy="24" r="7" fill="#2e9d4b"/><path d="M24 20v8M20 24h8" stroke="#fff" stroke-width="2.2"/></symbol>

  p('0','SECTION','2','TABLES','0','TABLE','2','LTYPE','70','1','0','LTYPE','2','CONTINUOUS','70','0','3','Solid line','72','65','73','0','40','0','0','ENDTAB');
  p('0','TABLE','2','LAYER','70',layers.size);
  for(const [name, color] of layers) p('0','LAYER','2',name,'70','0','62',color,'6','CONTINUOUS');
  p('0','ENDTAB','0','ENDSEC','0','SECTION','2','ENTITIES');
  poly('CHAPA', 0, 0, sheet.L, sheet.W);
  if(sheet.R > 0) poly('REFILO', sheet.R, sheet.R, sheet.L - sheet.R, sheet.W - sheet.R);
  for(const q of sheet.parts){ poly(`PERFIL_EXT_E${gf(sheet.esp)}`, q.x, q.y, q.x+q.w, q.y+q.h); const h = Math.max(6, Math.min(25, q.h/6, q.w/14)); text('ETIQUETAS', q.x + 8, q.y + q.h/2, h, `${q.letra} ${q.code} ${q.desc} ${q.L}x${q.W}`); }
  for(const e of ents){ if(e[0] === 'p'){ poly(e[1], e[2], e[3], e[4], e[5]); continue; } if(e[0] === 'c') p('0','CIRCLE','8',e[1],'10',n(e[2]),'20',n(e[3]),'30','0','40',n(e[4])); else p('0','LINE','8',e[1],'10',n(e[2]),'20',n(e[3]),'30','0','11',n(e[4]),'21',n(e[5]),'31','0'); }
  p('0','ENDSEC','0','EOF');
  return L.join('\r\n') + '\r\n';
}

/* ================= código de barras ================= */
const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128(text){
  const t = ascii(text); const codes = [104]; for(const ch of t) codes.push(ch.charCodeAt(0) - 32);
  let sum = 104; for(let i=1;i<codes.length;i++) sum += codes[i]*i; codes.push(sum % 103); codes.push(106);
  let x = 10, bars = ''; for(const c of codes){ const pat = C128[c]; for(let i=0;i<pat.length;i++){ const w = +pat[i]; if(i%2===0) bars += `<rect x="${x}" y="0" width="${w}" height="40" fill="#000"/>`; x += w; } }
  return `<svg viewBox="0 0 ${x+10} 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="${x+10}" height="40" fill="#fff"/>${bars}</svg>`;
}

// Medida do caixote quando o arquivo não traz: largura pelo nome (ex.: "Balcão 1200") ou pelas peças,
// altura e profundidade pelas laterais.
function caixoteDims(it){
  const ps = it.filhos.filter(c => c.tipo === 'peca'); if(!ps.length) return {};
  const lat = ps.filter(c => /lateral/i.test(c.desc) && !/gaveta/i.test(c.desc)); const ref = lat.length ? lat : ps;
  const A = Math.max(...ref.map(c => +c.L || 0)), P = Math.max(...ref.map(c => +c.W || 0));
  const nome = String(it.nome).match(/(?:^|\D)(\d{3,4})(?:\D|$)/); const horiz = ps.filter(c => /base|tampo|travessa|prateleira/i.test(c.desc));
  const L = nome ? +nome[1] : horiz.length ? Math.max(...horiz.map(c => +c.L || 0)) + 2 * (lat[0] ? +lat[0].esp : 0) : Math.max(...ps.map(c => +c.L || 0));
  return {L, P, A};
}

    return h;
  }).join('') + `<datalist id="dlMat">${[...new Set(S.cad.chapas.map(c=>c.material))].map(m=>`<option value="${esc(m)}">`).join('')}</datalist>`;

/* ================= tela: plano de corte ================= */
function renderPlano(){
  if(SIM){ SIM.rodando = false; cancelAnimationFrame(SIM.raf); }
  const R = ensureResult(); const G = groupsOf(R);
  if(!G.length){ $('#content').innerHTML = `<div class="pad">${R.errors.map(e=>`<p style="color:var(--red)">${esc(e)}</p>`).join('')}<p class="muted">Nenhuma peça nos projetos abertos. Abra um projeto em Projetos ou importe um TXT.</p></div>`; return; }
  if(UI.mat >= G.length) UI.mat = 0;

// Transforma o G-code em segmentos {a:[x,y,z], b:[x,y,z], rapido, d (diâmetro da ferramenta), linha}.
function simParse(code){
  const F = ferramentas(); const porT = {}; F.forEach(f => porT[+f.T] = f);
  let x = 0, y = 0, z = +S.cnc.safeZ || 15, d = +ferrCorte().diam, modo = 0, ferr = ferrCorte(); const seg = []; const trocas = [];

    const w = k => { const m = l.match(new RegExp(k + '\\s*(-?[\\d.]+)')); return m ? +m[1] : null; };
    const g = l.match(/G0?([0123])(?!\d)/); if(g) modo = +g[1];
    const X = w('X'), Y = w('Y'), Z = w('Z'); if(X === null && Y === null && Z === null) return;
    const nx = X ?? x, ny = Y ?? y, nz = Z ?? z;
    if(modo === 2 || modo === 3){ const I = w('I') || 0, J = w('J') || 0; const cx = x + I, cy = y + J, R = Math.hypot(I, J);

      for(let k = 1; k <= n; k++){ const t = k / n, a = a0 + da * t; const qx = cx + R*Math.cos(a), qy = cy + R*Math.sin(a), qz = z + (nz - z) * t; seg.push({a:[px, py, pz], b:[qx, qy, qz], rapido:false, d, linha:i, ferr}); px = qx; py = qy; pz = qz; }

// Raster da chapa: guarda a profundidade mais funda que a fresa chegou em cada ponto.
function simNovo(s, larg){

      <p class="muted" style="margin:0">≈ ${Math.ceil(tp.minutes)} min de máquina · ${tp.trocas ? tp.trocas + ' troca(s) de ferramenta' : '1 ferramenta'}</p></div></div></div>`;

function bindSim(s){
  const tp = toolpath(s); const linhas = tp.code.split('\n'); const cv = $('#simCv'), top = $('#simTop'); if(!cv) return;
  const larg = Math.max(300, Math.min(1400, cv.parentElement.clientWidth - 4));
  const A = simAnalisar(s, tp.code); const R = simNovo(s, larg); cv.width = top.width = R.w; cv.height = top.height = R.h;
  $('#simTeste').innerHTML = A.res.map(x => `<div style="color:${x.ok ? 'var(--green)' : 'var(--red)'};margin:3px 0">${x.ok ? '✓' : '⚠'} ${esc(x.txt)}</div>`).join('') + `<div style="margin-top:4px;color:${A.ok ? 'var(--green)' : 'var(--red)'}"><b>${A.ok ? 'Pode mandar para a máquina.' : 'Corrija antes de mandar para a máquina.'}</b></div>`;
  const ctx = cv.getContext('2d'), tctx = top.getContext('2d'); const seg = A.seg; const total = seg.reduce((a, g) => a + Math.max(0.001, Math.hypot(g.b[0]-g.a[0], g.b[1]-g.a[1], g.b[2]-g.a[2])), 0);
  const prev = SIM && SIM.key === s.key + s.n ? SIM : null; if(prev) cancelAnimationFrame(prev.raf);
  SIM = {key: s.key + s.n, R, seg, i:0, t:0, feito:0, total, rodando:false, vel: prev?.vel || 20, raf:0, A};
  const desenhaTopo = (pt, d) => { tctx.clearRect(0, 0, R.w, R.h); tctx.strokeStyle = 'rgba(47,109,181,.45)'; tctx.lineWidth = 1; tctx.setLineDash([4, 3]);
    if(UI.simContorno !== false) for(const p of s.parts) tctx.strokeRect(p.x * R.sc + .5, (s.W - p.y - p.h) * R.sc + .5, p.w * R.sc, p.h * R.sc);
    if(pt){ const x = pt[0] * R.sc, y = (s.W - pt[1]) * R.sc; tctx.setLineDash([]); tctx.beginPath(); tctx.arc(x, y, Math.max(3, d/2 * R.sc), 0, 2*Math.PI); tctx.fillStyle = pt[2] < 0 ? 'rgba(208,38,27,.85)' : 'rgba(47,109,181,.85)'; tctx.fill(); tctx.strokeStyle = '#fff'; tctx.stroke(); } };
  const info = () => { const g = seg[Math.min(SIM.i, seg.length - 1)]; const pct = SIM.total ? Math.min(100, SIM.feito / SIM.total * 100) : 100; $('#simBar').style.width = pct + '%';
    $('#simInfo').textContent = g ? `${fmt(pct, 0)}% · T${g.ferr?.T ?? ''} ${g.ferr?.nome ?? ''} · Z ${gf(+(g.a[2] + (g.b[2]-g.a[2])*SIM.t).toFixed(2))}` : '';
    if(g){ const n = g.linha; $('#simLinha').textContent = linhas.slice(Math.max(0, n - 2), n + 3).map((l, k) => (Math.max(0, n - 2) + k === n ? '▶ ' : '  ') + l).join('\n'); } };
  simPintar(R, ctx); desenhaTopo(null); info();
  let t0 = 0;
  const passo = ts => { if(!SIM.rodando) return; const dt = t0 ? Math.min(0.1, (ts - t0) / 1000) : 0; t0 = ts;
    // velocidade 1× = o avanço da fresa (mm/min); rápidos contam como 12 m/min
    let orc = dt * SIM.vel * (+S.cnc.feed || 6000) / 60;
    while(orc > 0 && SIM.i < seg.length){ const g = seg[SIM.i]; const L = Math.max(0.001, Math.hypot(g.b[0]-g.a[0], g.b[1]-g.a[1], g.b[2]-g.a[2])); const fator = g.rapido ? (+S.cnc.feed || 6000) / 12000 : 1;
      const resto = L * (1 - SIM.t); const usa = Math.min(resto, orc / fator); const t1 = SIM.t + usa / L; simSegmento(R, g, SIM.t, t1); SIM.feito += usa; orc -= usa * fator; SIM.t = t1; if(SIM.t >= 1 - 1e-9){ SIM.i++; SIM.t = 0; } }
    simPintar(R, ctx); const g = seg[Math.min(SIM.i, seg.length - 1)]; if(g) desenhaTopo([g.a[0] + (g.b[0]-g.a[0])*SIM.t, g.a[1] + (g.b[1]-g.a[1])*SIM.t, g.a[2] + (g.b[2]-g.a[2])*SIM.t], g.d); info();
    if(SIM.i >= seg.length){ SIM.rodando = false; $('[data-act=simPlay]').textContent = '▶ Simular corte'; desenhaTopo(null); toast('Simulação terminada.'); return; }
    SIM.raf = requestAnimationFrame(passo); };
  SIM.play = () => { if(SIM.i >= seg.length){ SIM.R.prof.fill(0); SIM.i = 0; SIM.t = 0; SIM.feito = 0; } SIM.rodando = !SIM.rodando; $('[data-act=simPlay]').textContent = SIM.rodando ? '❚❚ Pausar' : '▶ Simular corte'; if(SIM.rodando){ t0 = 0; SIM.raf = requestAnimationFrame(passo); } };
  SIM.reset = () => { SIM.rodando = false; cancelAnimationFrame(SIM.raf); R.prof.fill(0); SIM.i = 0; SIM.t = 0; SIM.feito = 0; $('[data-act=simPlay]').textContent = '▶ Simular corte'; simPintar(R, ctx); desenhaTopo(null); info(); };
  SIM.fim = () => { SIM.rodando = false; cancelAnimationFrame(SIM.raf); for(; SIM.i < seg.length; SIM.i++){ simSegmento(R, seg[SIM.i], SIM.t, 1); SIM.t = 0; } SIM.feito = SIM.total; $('[data-act=simPlay]').textContent = '▶ Simular corte'; simPintar(R, ctx); desenhaTopo(null); info(); };
  $('#simVel').onchange = () => { SIM.vel = +$('#simVel').value; };
}

function compras(){
  const R = ensureResult();
  const chap = {}; for(const s of R.sheets){ if(s.sobraId) continue; const c = chapaInfo(s.mat, s.esp); const k = c.id; (chap[k] = chap[k] || {c, n:0}).n++; }
  const inst = expandParts(); const bord = {}; const perda = 1 + (+S.cfg.perdaFita||0)/100;
  for(const p of inst) for(const [s] of SIDES){ const d = p.bordas[s]; if(!d) continue; const len = (s === 'inf' || s === 'sup') ? p.L : p.W; bord[d] = (bord[d]||0) + len/1000*perda; }
  const acc = {}; openProjects().forEach(pr => pr.itens.forEach(it => it.filhos.forEach(c => { if(c.tipo !== 'acessorio') return; const k = c.desc; (acc[k] = acc[k] || {c, n:0}).n += (c.qty||0)*(it.qty||1)*(pr.qtd||1); })));
  const accInfo = d => S.cad.acessorios.find(a => a.desc === d) || {preco:0, fornecedor:'', ref:'', un:'UN'};
  let sobraVal = 0; if(S.cfg.sobraValor) for(const s of R.sheets){ const c = chapaInfo(s.mat, s.esp); const m2 = c.preco / (c.L*c.W/1e6); for(const f of freeRects(s, R.gap)) sobraVal += f.w*f.h/1e6*m2; }
  const tC = Object.values(chap).reduce((a,x)=>a+x.n*(+x.c.preco||0),0), tB = Object.entries(bord).reduce((a,[d,m])=>a+m*(+bordaInfo(d).preco||0),0), tA = Object.values(acc).reduce((a,x)=>a+x.n*(+accInfo(x.c.desc).preco||0),0);
  const mo = R.sheets.filter(s=>!s.sobraId).length * (+S.cfg.maoObra||0);
  return {chap:Object.values(chap), bord:Object.entries(bord), acc:Object.values(acc), accInfo, tC, tB, tA, mo, sobraVal, total: tC + tB + tA + mo - sobraVal};
}
function renderCompras(){
  const L = compras();

  const H = '<th>Descrição</th><th class="n">Largura</th><th class="n">Altura</th><th class="n">Profundidade</th><th>Fornecedor</th><th>Ref. Fornecedor</th><th class="n">Qtde.</th><th class="n">Custo</th><th class="n">Total</th><th>UN</th>';
  let h = `<div style="display:flex;justify-content:flex-end;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:20px;font-weight:600">${money(L.total)}</div>`;
  h += sec('Chapas', L.tC, H, L.chap.map(({c,n})=>`<tr><td>${esc(c.material)} - ${c.esp}</td><td class="n">${c.L}</td><td class="n">${c.W}</td><td class="n">${c.esp}</td><td>${esc(c.fornecedor)}</td><td>${esc(c.ref)}</td><td class="n">${n}</td><td class="n">${fmt(c.preco,2)}</td><td class="n">${fmt(n*c.preco,2)}</td><td>UN</td></tr>`).join(''));
  h += sec('Bordas', L.tB, H, L.bord.map(([d,m])=>{ const b = bordaInfo(d); return `<tr><td>${esc(d)}</td><td class="n">1</td><td class="n">${b.altura||''}</td><td class="n">${String(b.esp).replace('.',',')}</td><td>${esc(b.fornecedor||'')}</td><td>${esc(b.ref||'')}</td><td class="n">${fmt(m,3)}</td><td class="n">${fmt(b.preco,2)}</td><td class="n">${fmt(m*b.preco,2)}</td><td>M</td></tr>`; }).join(''));
  h += sec('Acessórios', L.tA, H, L.acc.map(({c,n})=>{ const a = L.accInfo(c.desc); return `<tr><td>${esc(c.desc)}</td><td class="n">${c.L||''}</td><td class="n">${c.W||''}</td><td class="n">${c.esp||''}</td><td>${esc(a.fornecedor||'')}</td><td>${esc(a.ref||'')}</td><td class="n">${n}</td><td class="n">${fmt(a.preco,2)}</td><td class="n">${fmt(n*a.preco,2)}</td><td>UN</td></tr>`; }).join(''));
  h += `<div class="pad muted">${L.mo ? `Mão de obra: ${money(L.mo)} · ` : ''}${S.cfg.sobraValor ? `Valor das sobras descontado: ${money(L.sobraVal)} · ` : ''}Preços e fornecedores vêm de Cadastros. Perda de borda: ${S.cfg.perdaFita}%.</div>`;
  $('#content').innerHTML = h;
  setStatus(`Chapas: ${L.chap.reduce((a,x)=>a+x.n,0)}   ·   Bordas: ${fmt(L.bord.reduce((a,[,m])=>a+m,0),2)} m   ·   Acessórios: ${L.acc.reduce((a,x)=>a+x.n,0)}   ·   Total: ${money(L.total)}`);
}

function precosBanco(){ if(!S.cad.precos) S.cad.precos = LEO_PRECOS.map(([tipo, desc, preco, esp, larg, un, emb, marca, url]) => ({id:uid(), tipo, desc, preco, esp, larg, un, emb, marca, url, fonte:'Leo Madeiras'})); return S.cad.precos; }

const ORC_IGNORAR = new Set(['mdf','mdp','mm','de','da','do','e','x','chapa','fita','borda','cores']);
const orcTokens = s => ascii(s).toLowerCase().split(/[^a-z0-9]+/).filter(t => t && !/^\d+$/.test(t) && !ORC_IGNORAR.has(t));

function acharChapaFita(tipo, nome, esp){

  const cand = [];
  for(const m of precosBanco()){ if(m.tipo !== tipo) continue;
    if(tipo === 'chapa' ? +m.esp !== +esp : Math.abs((+m.esp || 0) - esp) > 0.15) continue;
    const d = ascii(m.desc).toLowerCase(), ok = cores.filter(t => d.includes(t)).length;
    if(ok < cores.length && !(cores.length >= 2 && ok >= cores.length - 1)) continue;

  cand.sort((a, b) => b.ok - a.ok || b.marca - a.marca || a.larg - b.larg || porUn(a.m) - porUn(b.m));

}

  const B = precosBanco();
  if(chave === 'dobradica') return B.filter(m => m.tipo === 'dobradica' && /35\s*mm/i.test(m.desc) && /110/.test(m.desc) && /reta/i.test(m.desc)).sort((a, b) => porUn(a) - porUn(b))[0] || null;

}
// Preço da linha: digitado > produto escolhido na lista > achado automático.
function precoOrc(key, auto){
  const man = (S.cad.orcPreco || {})[key]; if(man !== undefined && man !== '') return {preco:+man, origem:'preço digitado', m:null, manual:true};

  if(!m) m = auto(); return m ? {preco:Math.round(porUn(m) * 10000) / 10000, origem:m.desc, m, escolhido} : {preco:0, origem:null, m:null};
}

function orcCfg(){ return {...ORC_PADRAO, sobraFita:S.cfg.perdaFita, maoObra:S.cfg.maoObra, ...(S.cfg.orc || {})}; }

    return {...linha('chapa', 'chapa|' + k, `${nomeMat(x.mat, x.esp)} · ${x.n} chapa(s), ${fmt(x.area, 2)} m² usados`, q, O.modo === 'm2' ? 'chapa (m²)' : 'chapa', 'chapa', x.esp, () => acharChapaFita('chapa', x.mat, x.esp)), chapas:x.n}; });

function partDrawing(p, size=230){
  const pad = 34, sc = Math.min((size - 2*pad) / p.L, (size*0.7 - 2*pad) / p.W); const w = p.L*sc, h = p.W*sc; const H = h + 2*pad, Wd = w + 2*pad;
  const X = u => pad + u*sc, Yv = v => pad + h - v*sc; const b = p.bordas || {};
  let g = `<svg viewBox="0 0 ${Wd} ${H}" width="${Wd}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial"><rect x="${pad}" y="${pad}" width="${w}" height="${h}" fill="#f7f1e3" stroke="#5b4a2e"/>`;
  const e = (x1,y1,x2,y2,on) => on ? `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d0461b" stroke-width="3.5"/>` : '';
  g += e(pad, pad+h, pad+w, pad+h, b.inf) + e(pad, pad, pad+w, pad, b.sup) + e(pad, pad, pad, pad+h, b.esq) + e(pad+w, pad, pad+w, pad+h, b.dir);
  const nf = new Map(furosDaPeca(p).map((o, i) => [o, i + 1]));
  for(const o of p.ops||[]){ if(o.tipo==='furo') g += `<circle cx="${X(o.x)}" cy="${Yv(o.y)}" r="${Math.max(1.5,o.d/2*sc)}" fill="#fff" stroke="#c8372d"/><text x="${X(o.x) + Math.max(1.5,o.d/2*sc) + 1}" y="${Yv(o.y) - 2}" font-size="8" fill="#c8372d">${nf.get(o)}</text>`;
    else if(o.tipo==='rebaixo') g += `<rect x="${X(o.x)}" y="${Yv(+o.y + +o.h)}" width="${o.w*sc}" height="${o.h*sc}" fill="${+o.prof >= p.esp ? '#fff' : '#f2c9c3'}" stroke="#c8372d" ${+o.prof >= p.esp ? 'stroke-dasharray="4 2"' : ''}/>`;
    else if(o.tipo==='furoTopo'){ const ln = Math.max(4, o.prof*sc); const at = o.lado==='inf' ? [X(o.pos), Yv(0), X(o.pos), Yv(0)-ln] : o.lado==='sup' ? [X(o.pos), Yv(p.W), X(o.pos), Yv(p.W)+ln] : o.lado==='esq' ? [X(0), Yv(o.pos), X(0)+ln, Yv(o.pos)] : [X(p.L), Yv(o.pos), X(p.L)-ln, Yv(o.pos)]; g += `<line x1="${at[0]}" y1="${at[1]}" x2="${at[2]}" y2="${at[3]}" stroke="#c8372d" stroke-width="2" stroke-dasharray="3 2"/>`; }
    else if(o.tipo==='rasgo') g += `<line x1="${X(o.x)}" y1="${Yv(o.y)}" x2="${X(o.x2)}" y2="${Yv(o.y2)}" stroke="#c8372d" stroke-width="${Math.max(1.5,S.cnc.diam*sc)}" stroke-opacity=".6"/>`; }
  g += `<line x1="${pad}" y1="${pad+h+16}" x2="${pad+w}" y2="${pad+h+16}" stroke="#55606c" marker-start="url(#ar)" /><text x="${pad+w/2}" y="${pad+h+29}" font-size="11" text-anchor="middle" fill="#1d2733">${gf(p.L)}</text>`;
  g += `<line x1="${pad-16}" y1="${pad}" x2="${pad-16}" y2="${pad+h}" stroke="#55606c"/><text transform="rotate(-90 ${pad-21} ${pad+h/2})" x="${pad-21}" y="${pad+h/2}" font-size="11" text-anchor="middle" fill="#1d2733">${gf(p.W)}</text>`;
  if(p.veio) g += `<text x="${pad+w/2}" y="${pad+h/2+4}" font-size="11" text-anchor="middle" fill="#8a7350">veio ⟷</text>`;
  return g + '</svg>';
}

/* ================= exportação CNC ================= */

function renderExport(){
  const posts = Object.entries(POSTS).filter(([k]) => S.plugins[k] !== false);

/* ================= renderização geral ================= */
function setStatus(t){ $('#status').innerHTML = `<span>${t}</span><span class="sp"></span>${typeof bkStatusHTML === 'function' ? bkStatusHTML() : ''}<span class="muted">${openProjects().length} projeto(s) no plano</span>`; }
function render(){
  if(UI.view === 'projeto' && !proj(UI.proj)){ UI.proj = S.abertos[0]; if(!UI.proj) UI.view = 'projetos'; }
  syncAbas();
  if(UI.aba === 'vis'){ renderRibbonVis(); renderTree(); $('#dtabs').hidden = false; $('#dtabs').innerHTML = `<button class="on">Ambiente 3D${ambDono() ? ' · ' + esc(ambDono().nome) : ''}</button>`; renderAmbiente(); save(); return; }
  renderRibbon(); renderTree(); renderTabs();
  const v = UI.view;
  if(v === 'projeto'){ const pr = proj(UI.proj); renderProject(pr); const pcs = pr.itens.reduce((a,i)=>a+i.filhos.filter(c=>c.tipo==='peca').reduce((b,c)=>b+(c.qty||0)*(i.qty||1),0),0)*(pr.qtd||1); setStatus(`${pr.itens.length} itens · ${pcs} peças · ${esc(pr.status)}`); }
  else if(v === 'projetos'){ renderProjetos(); setStatus(`${S.projetos.length} projeto(s) cadastrados`); }
  else if(v === 'plano') renderPlano();
  else if(v === 'compras') renderCompras();
  else if(v === 'orcamento') renderOrcamento();
  else if(v === 'desenhos') renderDesenhos();
  else if(v.startsWith('cad-')) renderCad(v);
  else if(v === 'export') renderExport();
  save();
}

/* ================= ações ================= */
const ACT = {
  go: el => { UI.view = el.dataset.view; UI.aba = 'principal'; AV.cons = null; UI.back = null; render(); },
  openTab: el => { const id = el.dataset.id; if(!S.abertos.includes(id)) S.abertos.push(id); UI.view = 'projeto'; UI.proj = id; UI.sel = null; closeBack(); render(); },
  closeTab: (el, e) => { e.stopPropagation(); S.abertos = S.abertos.filter(x => x !== el.dataset.id); if(UI.proj === el.dataset.id){ UI.proj = S.abertos[0]; if(!UI.proj) UI.view = 'projetos'; } render(); },
  togglePlano: el => { const id = el.dataset.id; if(el.checked){ if(!S.abertos.includes(id)) S.abertos.push(id); } else S.abertos = S.abertos.filter(x => x !== id); render(); },
  toggleInfo: () => { const pr = proj(UI.proj); pr.infoOpen = !pr.infoOpen; render(); },
  toggleItem: el => { const pr = proj(UI.proj); const it = pr.itens.find(i => i.id === el.closest('tr').dataset.iid); it.open = !it.open; $('#gridBody').innerHTML = gridRows(pr); save(); },
  expandAll: () => { proj(UI.proj).itens.forEach(i => i.open = true); render(); },
  collapseAll: () => { proj(UI.proj).itens.forEach(i => i.open = false); render(); },
  moveUp: () => moveSel(-1), moveDown: () => moveSel(1),
  novoItem: () => { const pr = proj(UI.proj); if(!pr) return; const it = newItem({nome:'Novo item'}); const {it:cur} = findSel(pr); const i = cur ? pr.itens.indexOf(cur) + 1 : pr.itens.length; pr.itens.splice(i, 0, it); UI.sel = {iid:it.id}; pr.exemplo = false; touch(pr); render(); focusSel(); destacarSel('Caixote novo criado. Digite o nome e use Novo Filho para pôr peças nele.'); },
  novoFilho: () => addChild('peca'), novoAcc: () => addChild('acessorio'),
  removerItem: () => { const pr = proj(UI.proj); const {it, c} = findSel(pr); if(!it){ toast('Clique primeiro na linha do caixote ou da peça que quer remover.'); return; } pedirRemocao(pr, it, c); },
  delRow: (el, e) => { e.stopPropagation(); const tr = el.closest('tr'); const pr = proj(UI.proj); const it = pr.itens.find(i => i.id === tr.dataset.iid); const c = tr.dataset.cid ? it.filhos.find(f => f.id === tr.dataset.cid) : null; pedirRemocao(pr, it, c); },
  duplicarItem: () => { const pr = proj(UI.proj); const {it, c} = findSel(pr); if(!it){ toast('Clique primeiro na linha do caixote ou da peça que quer duplicar.'); return; } if(c){ const n = mark({...JSON.parse(JSON.stringify(c, stripOrig)), id:uid()}); it.filhos.splice(it.filhos.indexOf(c)+1, 0, n); UI.sel = {iid:it.id, cid:n.id}; } else { const n = JSON.parse(JSON.stringify(it, stripOrig)); n.id = uid(); n.nome += ' (cópia)'; n.filhos.forEach(f => { f.id = uid(); mark(f); }); mark(n); pr.itens.splice(pr.itens.indexOf(it)+1, 0, n); UI.sel = {iid:n.id}; } touch(pr); render(); destacarSel(c ? 'Peça duplicada logo abaixo.' : 'Caixote duplicado logo abaixo, com todas as peças.'); },
  reverterItem: () => { const pr = proj(UI.proj); const {it, c} = findSel(pr); const o = c || it; if(!o){ toast('Clique primeiro na linha do caixote ou da peça que quer reverter.'); return; } if(!o._orig){ toast('Este item foi criado agora e não tem versão anterior.'); return; } if(o._orig === JSON.stringify(o, stripOrig) && (c || it.filhos.every(f => !f._orig || f._orig === JSON.stringify(f, stripOrig)))){ toast('Este item não tem alterações para desfazer.'); return; } const back = JSON.parse(o._orig); for(const k of Object.keys(o)) if(k !== '_orig' && k !== 'id') delete o[k]; Object.assign(o, back, {id:o.id}); if(!c) o.filhos.forEach(mark); touch(pr); render(); destacarSel(c ? 'A peça voltou como estava quando foi importada/criada.' : 'O caixote e as peças dele voltaram como estavam quando foram importados/criados.'); },
  novoProjeto: () => { const pr = newProject({nome:'Novo Projeto'}); S.projetos.push(pr); S.abertos.push(pr.id); UI.view = 'projeto'; UI.proj = pr.id; UI.sel = null; closeBack(); render(); setTimeout(()=>{ const i = document.querySelector('[data-pf="nome"]'); i?.focus(); i?.select(); }, 30); },
  removerProjeto: () => { const pr = proj(UI.proj); if(!pr) return; confirmar('Remover projeto', `Remover o projeto <b>${esc(pr.nome)}</b> com ${pr.itens.length} caixote(s)? Isso não pode ser desfeito (a não ser por um backup).`, 'Remover projeto', () => removeProject(pr.id)); },
  duplicarProjeto: () => { const pr = proj(UI.proj); const n = JSON.parse(JSON.stringify(pr)); n.id = uid(); n.nome += ' (cópia)'; n.criado = today(); n.mod = Date.now(); n.itens.forEach(i => { i.id = uid(); i.filhos.forEach(f => f.id = uid()); }); S.projetos.push(n); S.abertos.push(n.id); UI.proj = n.id; render(); },

function confirmar(titulo, texto, botao, fn){ CONF = fn; modal(titulo, `<p style="margin:0;max-width:52ch">${texto}</p>`, `<button class="btn danger" data-act="confOk">${botao}</button><button class="btn" data-act="modalClose">Cancelar</button>`, {w:'440px'}); setTimeout(() => $('[data-act=confOk]')?.focus(), 30); }
let CONF = null;
ACT.confOk = () => { const f = CONF; CONF = null; ACT.modalClose(); f && f(); };
function pedirRemocao(pr, it, c){
  const txt = c ? `Remover ${c.tipo === 'peca' ? 'a peça' : 'o acessório'} <b>${esc(c.desc)}</b> do caixote <b>${esc(it.nome)}</b>?` : `Remover o caixote <b>${esc(it.nome)}</b> e as ${it.filhos.length} peça(s)/acessório(s) dele?`;
  confirmar(c ? 'Remover peça' : 'Remover caixote', txt, 'Remover', () => { if(c) it.filhos.splice(it.filhos.indexOf(c), 1); else pr.itens.splice(pr.itens.indexOf(it), 1); UI.sel = null; pr.exemplo = false; touch(pr); render(); toast(c ? 'Peça removida.' : 'Caixote removido.'); });
}
function removeProject(id){ S.projetos = S.projetos.filter(p => p.id !== id); S.abertos = S.abertos.filter(x => x !== id); if(UI.proj === id){ UI.proj = S.abertos[0]; if(!UI.proj) UI.view = 'projetos'; } UI.sel = null; render(); }
function addChild(tipo){ const pr = proj(UI.proj); if(!pr) return; let {it, c} = findSel(pr); if(!it){ toast('Clique primeiro no caixote onde a peça vai entrar.'); return; } const last = it.filhos.filter(f=>f.tipo==='peca').slice(-1)[0];
  const n = tipo === 'peca' ? newPart({mat:last?.mat || S.cad.chapas[0]?.material || 'MDF Branco', esp:last?.esp || 15}) : newAcc(); const i = c ? it.filhos.indexOf(c) + 1 : it.filhos.length; it.filhos.splice(i, 0, n); it.open = true; UI.sel = {iid:it.id, cid:n.id}; pr.exemplo = false; touch(pr); render(); focusSel(); destacarSel(`${tipo === 'peca' ? 'Peça nova' : 'Acessório novo'} no caixote “${it.nome}”. Preencha nome e medidas.`); }
function destacarSel(msg){ setTimeout(() => { const tr = document.querySelector('#gridBody tr.sel'); if(tr){ tr.scrollIntoView({block:'nearest'}); tr.classList.add('flash'); setTimeout(() => tr.classList.remove('flash'), 1600); } if(msg) toast(msg); }, 30); }
function focusSel(){ setTimeout(()=>{ const i = document.querySelector('#gridBody tr.sel input:not([type=checkbox])'); i?.focus(); i?.select(); }, 20); }
function moveSel(d){ const pr = proj(UI.proj); const {it, c} = findSel(pr); if(!it) return; const arr = c ? it.filhos : pr.itens; const o = c || it; const i = arr.indexOf(o), j = i + d; if(j < 0 || j >= arr.length) return; arr.splice(i, 1); arr.splice(j, 0, o); touch(pr); render(); }

document.addEventListener('change', e => {
  const t = e.target; const val = t.type === 'checkbox' ? t.checked : (t.type === 'number' ? (num(t.value) || 0) : t.value);
  if(t.dataset.pf === 'corredica'){ const pr = proj(UI.proj); pr.corredica = t.value; let n = 0; for(const it of pr.itens) for(const c of it.filhos) if(c.tipo === 'peca' && c.auto && /^gav/.test(c.esquema) && furacaoAuto(c, true, pr)){ mark(c); n++; }
    for(const it of pr.itens) for(const c of it.filhos) if(c.tipo === 'peca' && !(c.ops || []).length && furacaoAuto(c, true, pr)){ mark(c); n++; }

  if(t.dataset.f){ const tr = t.closest('tr'); const pr = proj(UI.proj); const it = pr.itens.find(i => i.id === tr.dataset.iid); const o = tr.dataset.cid ? it.filhos.find(f => f.id === tr.dataset.cid) : it; o[t.dataset.f] = val; pr.exemplo = false; touch(pr); if(['qty','L','W'].includes(t.dataset.f) && !tr.dataset.cid) {} return; }
  if(t.dataset.cf){ const tr = t.closest('tr'); const list = tr.dataset.cad === 'sobras' ? S.sobras : S.cad[tr.dataset.cad]; list[+tr.dataset.i][t.dataset.cf] = val; if(tr.dataset.cad === 'ferramentas'){ syncCorte(false); RESULT = null; if(t.dataset.cf === 'tipo') render(); } save(); return; }
  if(t.dataset.fur){ S.cad.furacao = {...(S.cad.furacao || {}), [t.dataset.fur]: num(t.value) || 0}; save(); return; }
  if(t.dataset.orcq !== undefined){ const PK = orcProjKey(); S.orcQtd = S.orcQtd || {}; const m = S.orcQtd[PK] = S.orcQtd[PK] || {}; const k = t.dataset.orcq;
    if(k.startsWith('av|')){ const a = ((S.orcAvulso || {})[PK] || []).find(a => 'av|' + a.id === k); if(a) a.qtd = num(t.value) || 0; } else if(t.value === '') delete m[k]; else m[k] = num(t.value) || 0; save(); render(); return; }
  if(t.dataset.orcad !== undefined){ const a = ((S.orcAvulso || {})[orcProjKey()] || []).find(a => a.id === t.dataset.orcad); if(a) a.desc = t.value; save(); render(); return; }
  if(t.dataset.orcp !== undefined){ S.cad.orcPreco = {...(S.cad.orcPreco || {})}; if(t.value === '') delete S.cad.orcPreco[t.dataset.orcp]; else S.cad.orcPreco[t.dataset.orcp] = num(t.value) || 0; save(); render(); return; }
  if(t.dataset.orcv !== undefined){ S.cad.orcVinc = {...(S.cad.orcVinc || {}), [t.dataset.orcv]: t.value}; if(!t.value) delete S.cad.orcVinc[t.dataset.orcv]; if(S.cad.orcPreco) delete S.cad.orcPreco[t.dataset.orcv]; save(); render(); return; }
  if(t.dataset.orcf){ S.cfg.orc = {...(S.cfg.orc || {}), [t.dataset.orcf]: t.dataset.orcf === 'modo' ? t.value : (num(t.value) || 0)}; save(); render(); return; }
  if(t.dataset.pr){ const m = precosBanco()[+t.closest('tr').dataset.pi]; m[t.dataset.pr] = t.dataset.pr === 'desc' ? t.value : (t.value === '' ? null : num(t.value)); if(t.dataset.pr === 'emb' && !(m.emb > 0)) m.emb = 1; save(); render(); return; }
  if(t.dataset.corr){ S.cad.corrFuros = {...(S.cad.corrFuros || {}), [t.dataset.corr]: t.value}; save(); return; }
  if(t.dataset.rg){ furRegras()[+t.closest('tr').dataset.ri][t.dataset.rg] = t.value; save(); return; }
  if(t.dataset.furs){ S.cad.furacao = {...(S.cad.furacao || {}), [t.dataset.furs]: t.value}; save(); render(); return; }
  if(t.dataset.bind){ const [o, k] = t.dataset.bind.split('.'); const target = o === 'cnc' ? S.cnc : S.cfg; target[k] = (t.tagName === 'SELECT' && isNaN(+t.value)) ? t.value : (t.type === 'number' || t.tagName === 'SELECT' ? num(t.value) : t.value); if(o === 'cnc' && ['diam','rpm','feed','plunge','passo'].includes(k)) syncCorte(true); save(); if(UI.back) renderBack(); else render(); return; }
  if(t.id === 'kHeader' || t.id === 'kFooter'){ const c = S.cnc.custom[S.cnc.post] = S.cnc.custom[S.cnc.post] || {}; c[t.id === 'kHeader' ? 'header' : 'footer'] = t.value; save(); return; }

  if(t.dataset.status){ const pr = proj(t.dataset.status); pr.status = t.value; save(); return; }
  if(t.id === 'repPaper'){ UI.paper = t.value; renderBack(); return; }
  if(t.id === 'repPages'){ UI.pages = t.value; renderBack(); return; }
});

function decodeText(buf){ try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }catch(err){ return new TextDecoder('windows-1252').decode(buf); } }
async function readImportFile(f){
  const buf = await f.arrayBuffer();

  return [{name:f.name, text:decodeText(buf)}];
}
// leitor de .zip (sem compressão ou deflate), usando o diretório central
async function unzip(buf){

  for(let k = 0; k < n; k++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true), flags = dv.getUint16(p + 8, true);

  let s = `H DX=${gf(p.L)} DY=${gf(p.W)} DZ=${gf(p.esp)} -A C=0 T=0 R=1 *MM /"DEF"\r\n; ${ascii(p.projeto)} - ${ascii(p.item)} - ${ascii(p.desc)} - ${ascii(p.mat)} - Qtd ${p.qty}\r\n`;

    if(o.tipo === 'furo') s += `B X=${gf(o.x)} Y=${gf(o.y)} Z=${o.prof >= p.esp ? -gf(p.esp + S.cnc.overcut) : -gf(o.prof)} G=0 D=${gf(o.d)} N="" F=1\r\n`;
    else if(o.tipo === 'rasgo') s += `G0 X=${gf(o.x)} Y=${gf(o.y)} Z=${-gf(o.prof)} T=101\r\nL X=${gf(o.x2)} Y=${gf(o.y2)}\r\n`;
    else if(o.tipo === 'rebaixo') s += `G0 X=${gf(o.x)} Y=${gf(o.y)} Z=${-gf(Math.min(o.prof, p.esp + S.cnc.overcut))} T=101\r\nL X=${gf(+o.x + +o.w)} Y=${gf(o.y)}\r\nL X=${gf(+o.x + +o.w)} Y=${gf(+o.y + +o.h)}\r\nL X=${gf(o.x)} Y=${gf(+o.y + +o.h)}\r\nL X=${gf(o.x)} Y=${gf(o.y)}\r\n`;
    else if(o.tipo === 'furoTopo') s += `; furo de topo D${gf(o.d)} P${gf(o.prof)} borda ${o.lado} pos ${gf(o.pos)}\r\n`;
  }
  return s;
}
// --- Cut Rite (.ptx) ---
function ptx(){
  const ps = pecasAgrupadas(), ch = chapasUsadas(); const mats = ch.map((c,i) => ({...c, code:`M${i+1}`}));
  const mcode = p => mats.find(m => m.mat === p.mat && +m.esp === +p.esp).code;
  const q = s => `"${ascii(s).replace(/"/g,"'")}"`;
  const L = [`HEADER,1.06,${q(baseNome())},0,0,0,2`, `JOBS,1,${q(baseNome())},${q(openProjects().map(p=>p.cliente).filter(Boolean).join(' / '))},${today().replace(/-/g,'')},${today().replace(/-/g,'')},0`];
  ps.forEach((p,i) => L.push(`PARTS_REQ,1,${i+1},${q(p.code)},${mcode(p)},${gf(p.L)},${gf(p.W)},${p.qty},0,0,0,${p.veio?1:0},${q(p.desc)},${q(p.item)},${q(p.b.inf)},${q(p.b.sup)},${q(p.b.esq)},${q(p.b.dir)}`));
  mats.forEach((m,i) => L.push(`MATERIALS,1,${m.code},${q(m.mat)},${gf(m.esp)},${gf(S.cfg.gap)},${gf(S.cfg.refilo)},${gf(S.cfg.refilo)},${m.veio?1:0}`));
  mats.forEach((m,i) => L.push(`BOARDS,1,${i+1},${q(m.ref || m.code)},${m.code},${gf(m.L)},${gf(m.W)},99999,0,0,0,${m.veio?1:0}`));
  return L.join('\r\n') + '\r\n';
}

async function pendCheck(manual){
  if(!PEND.dir || PEND.checking) return; PEND.checking = true;
  try{
    if(manual && PEND.perm !== 'granted') PEND.perm = await PEND.dir.requestPermission({mode:'read'});
    if(PEND.perm !== 'granted'){ PEND.checking = false; if(UI.back === 'pendentes') renderBack(); return; }
    const done = new Set(S.importados || []); const list = [];
    for await (const [name, h] of PEND.dir.entries()) if(h.kind === 'file' && /\.(txt|csv|tsv|dat|zip)$/i.test(name)){ const f = await h.getFile(); if(!done.has(pendKey(f))) list.push(f); }
    list.sort((a,b) => b.lastModified - a.lastModified);
    const novos = list.filter(f => !PEND.list.some(g => pendKey(g) === pendKey(f)));
    PEND.list = list; if(novos.length && !manual && PEND.seen) toast(`${novos.length} arquivo(s) novo(s) do Promob em Importações Pendentes.`); PEND.seen = true;

/* ---------- editor de operações ---------- */
let EDIT = null;
// Usinagens, em coordenadas da peça (X ao longo do comprimento, Y ao longo da largura, 0,0 no canto inferior esquerdo, vista de cima):
// furo {x,y,d,prof} · furoTopo {lado,pos,d,prof,z} (furo na borda: furadeira horizontal, não vai no G-code da fresa)
// rasgo {x,y,x2,y2,prof,larg} · rebaixo {x,y,w,h,prof} (prof >= espessura = recorte vazado)
const OP_GRUPOS = [['furo','Furos'],['furoTopo','Furos de topo'],['rasgo','Rasgos'],['rebaixo','Rebaixos e recortes']];
const LADO_NOME = {inf:'inferior', sup:'superior', esq:'esquerda', dir:'direita'};
const ladoLen = (lado, d) => (lado === 'inf' || lado === 'sup') ? +d.L : +d.W;
function opFora(o, d){
  const fora = (x, y) => !(x >= -EPS && y >= -EPS && x <= +d.L + EPS && y <= +d.W + EPS);
  if(o.tipo === 'furo') return fora(+o.x, +o.y);
  if(o.tipo === 'rasgo') return fora(+o.x, +o.y) || fora(+o.x2, +o.y2);
  if(o.tipo === 'rebaixo') return !(o.w > 0 && o.h > 0) || fora(+o.x, +o.y) || fora(+o.x + +o.w, +o.y + +o.h);
  if(o.tipo === 'furoTopo') return !(o.pos >= 0 && o.pos <= ladoLen(o.lado, d));
  return false;
}
function opTexto(o, d){
  if(o.tipo === 'furo') return `Furo Ø${gf(o.d)} prof. ${gf(o.prof)} em X ${gf(o.x)} Y ${gf(o.y)}`;
  if(o.tipo === 'furoTopo') return `Furo de topo Ø${gf(o.d)} prof. ${gf(o.prof)} na borda ${LADO_NOME[o.lado]}, a ${gf(o.pos)} mm`;
  if(o.tipo === 'rasgo') return `Rasgo larg. ${gf(o.larg || S.cnc.diam)} prof. ${gf(o.prof)} de X ${gf(o.x)} Y ${gf(o.y)} até X ${gf(o.x2)} Y ${gf(o.y2)}`;
  if(o.tipo === 'rebaixo') return `${+o.prof >= +d.esp ? 'Recorte vazado' : 'Rebaixo prof. ' + gf(o.prof)} ${gf(o.w)} × ${gf(o.h)} em X ${gf(o.x)} Y ${gf(o.y)}`;
  return o.tipo;
}
// Esquema salvo pelo usuário: cada medida fica presa à borda mais perto, para servir em peças de outro tamanho.
function esqParam(ops, d){
  const px = v => +v > d.L/2 ? {f: +d.L - v} : {i: +v}, py = v => +v > d.W/2 ? {f: +d.W - v} : {i: +v};
  return ops.map(o => o.tipo === 'furoTopo' ? {...o, pos: +o.pos > ladoLen(o.lado, d)/2 ? {f: ladoLen(o.lado, d) - o.pos} : {i: +o.pos}}
    : o.tipo === 'rebaixo' ? {...o, x: px(o.x), y: py(o.y), x2: px(+o.x + +o.w), y2: py(+o.y + +o.h), w: undefined, h: undefined, vazado: +o.prof >= +d.esp}
    : o.tipo === 'rasgo' ? {...o, x: px(o.x), y: py(o.y), x2: px(o.x2), y2: py(o.y2)} : {...o, x: px(o.x), y: py(o.y)});
}
function esqAplicar(ops, d){
  const r = (a, tot) => +(a.f !== undefined ? tot - a.f : a.i).toFixed(1);

/* ================= envio GRBL (Web Serial) ================= */
const SER = {port:null, writer:null, reader:null, buf:'', waiters:[], paused:false, stop:false, busy:false, status:'Desconectado', pct:0};
const serStatus = t => { SER.status = t; const el = $('#serialStatus'); if(el) el.textContent = t; };
async function serialReadLoop(){ const dec = new TextDecoder(); try{ while(SER.port && SER.reader){ const {value, done} = await SER.reader.read(); if(done) break; SER.buf += dec.decode(value); let i; while((i = SER.buf.indexOf('\n')) >= 0){ const line = SER.buf.slice(0,i).trim(); SER.buf = SER.buf.slice(i+1); if(!line) continue; if(line === 'ok' || line.startsWith('error')){ const w = SER.waiters.shift(); if(w) w(line); } else if(line.startsWith('ALARM')){ serStatus('Alarme: ' + line); SER.stop = true; const w = SER.waiters.shift(); if(w) w('error'); } else if(/^Grbl/i.test(line)) serStatus('Conectado: ' + line); } } }catch(e){} if(SER.port){ SER.stop = true; SER.waiters.splice(0).forEach(w => w('error: conexão perdida')); serStatus('Conexão com a máquina perdida. Confira o cabo e conecte de novo.'); } }
function planoOk(){ if(RESULT?.stale){ toast('O plano está desatualizado. Clique em Refazer plano antes de gerar arquivos.'); return false; } return true; }
async function serialConnect(){
  if(!S.plugins.usb){ toast('Ative o Plugin Envio Direto USB em Arquivo › Plugins.'); return; }
  if(!('serial' in navigator)){ toast('Envio por USB precisa do Edge ou Chrome.'); return; }
  try{ if(SER.port){ await serialClose(); renderPlano(); return; }
    SER.port = await navigator.serial.requestPort(); await SER.port.open({baudRate: +($('#baud')?.value || 115200)}); SER.writer = SER.port.writable.getWriter(); SER.reader = SER.port.readable.getReader(); serialReadLoop(); serStatus('Conectado'); await SER.writer.write(new TextEncoder().encode('\r\n\r\n')); renderPlano();
  }catch(e){ SER.port = null; if(e.name !== 'NotFoundError') toast('Não consegui conectar: ' + e.message); }
}
async function serialClose(){ const p = SER.port; SER.port = null; SER.stop = true; SER.waiters.splice(0).forEach(w => w('error: desconectado')); try{ await SER.reader?.cancel(); SER.reader?.releaseLock(); SER.writer?.releaseLock(); await p?.close(); }catch(e){} SER.reader = SER.writer = null; serStatus('Desconectado'); }
// Cada linha espera o "ok" da GRBL; sem resposta em 60 s (cabo solto, máquina desligada) vira erro em vez de travar.
const sendLine = l => new Promise(res => { let done = false; const fin = r => { if(!done){ done = true; clearTimeout(t); res(r); } }; const t = setTimeout(() => { SER.waiters = SER.waiters.filter(w => w !== fin); fin('error: sem resposta da máquina em 60 s'); }, 60000); SER.waiters.push(fin); SER.writer.write(new TextEncoder().encode(l + '\n')).catch(e => fin('error: ' + e.message)); });
async function serialSend(b){
  if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'Confirmar: começar o corte'; setTimeout(()=>{ if(b.isConnected){ b.dataset.armed=''; b.textContent='Enviar e cortar'; } }, 5000); return; }
  if(SER.busy) return; if(!S.plugins.usb){ toast('Ative o Plugin Envio Direto USB em Arquivo › Plugins.'); return; } if(!planoOk()) return; const s = CURSHEET; if(!s) return;
  const lines = toolpath(s).code.split('\n').map(l => l.replace(/\(.*?\)/g,'').trim()).filter(l => l && l !== '%' && !/^O\d+/.test(l));
  SER.busy = true; SER.stop = false; SER.paused = false; renderPlano();
  for(let i=0;i<lines.length;i++){ if(SER.stop) break; while(SER.paused && !SER.stop) await new Promise(r=>setTimeout(r,200)); const res = await sendLine(lines[i]); if(res.startsWith('error')){ serStatus(`Erro na linha ${i+1}: ${lines[i]} → ${res}`); break; } SER.pct = (i+1)/lines.length*100; const bar = $('#sendBar'); if(bar) bar.style.width = SER.pct.toFixed(1) + '%'; if(i % 20 === 0) serStatus(`Enviando linha ${i+1} de ${lines.length}`); }
  if(!SER.stop) serStatus('Arquivo enviado. Aguarde a máquina terminar.'); SER.busy = false; renderPlano();
}
async function serialPause(){ if(!SER.writer) return; SER.paused = !SER.paused; await SER.writer.write(new TextEncoder().encode(SER.paused ? '!' : '~')); renderPlano(); }
async function serialStop(){ if(!SER.writer) return; SER.stop = true; SER.paused = false; await SER.writer.write(new Uint8Array([0x18])); SER.waiters.splice(0).forEach(w=>w('error')); serStatus('Parado (reset enviado). Rearme com $X se precisar.'); }
